<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Alpha Admin</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0b0b12;
      color: white;
      padding: 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #00e5ff;
      margin-bottom: 20px;
    }

    .card {
      background: #151520;
      border: 1px solid #303044;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 9px;
      border: 1px solid #36364a;
      background: #0e0e17;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #00e5ff;
      color: #001014;
    }

    .on {
      background: #00c853;
      color: white;
    }

    .off {
      background: #d32f2f;
      color: white;
    }

    .process {
      background: #00c853;
      color: white;
    }

    .failed {
      background: #d32f2f;
      color: white;
    }

    .refresh {
      background: #36364a;
      color: white;
    }

    .message-choice {
      background: #0e0e17;
      border: 1px solid #36364a;
      color: white;
      text-align: left;
    }

    .status {
      padding: 10px;
      border-radius: 9px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .status-on {
      background: #123d25;
      color: #5ee39a;
    }

    .status-off {
      background: #4a1717;
      color: #ff7777;
    }

    .order {
      background: #0e0e17;
      border: 1px solid #303044;
      border-radius: 12px;
      padding: 13px;
      margin-top: 10px;
    }

    .line {
      margin: 7px 0;
      font-size: 14px;
    }

    .line span {
      color: #aaa;
    }

    .pack {
      color: #00e5ff;
    }

    .price {
      color: #00e5ff;
      font-weight: bold;
    }

    .order-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .order-buttons button {
      flex: 1;
    }

    /* SISTÈM PAGINATION AK FLÈCH */
    .pagination-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      margin-bottom: 10px;
      background: #0e0e17;
      padding: 8px 12px;
      border-radius: 9px;
      border: 1px solid #303044;
    }

    .pagination-btn {
      width: auto;
      padding: 8px 16px;
      margin-top: 0;
      background: #00e5ff;
      color: #001014;
    }

    .pagination-btn:disabled {
      background: #36364a;
      color: #777;
      cursor: not-allowed;
    }

    .pagination-info {
      font-size: 14px;
      font-weight: bold;
      color: #00e5ff;
    }

    #adminArea {
      display: none;
    }

    #offArea {
      display: none;
      margin-top: 10px;
    }

    #message {
      display: none;
      background: #151520;
      border-radius: 9px;
      padding: 12px;
      text-align: center;
      margin-bottom: 15px;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💎 TRUE ALPHA ADMIN</h1>

  <!-- LOGIN -->

  <div class="card" id="loginBox">

    <h3>🔐 Admin Login</h3>

    <input
      type="password"
      id="adminToken"
      placeholder="Antre ADMIN_TOKEN ou"
      autocomplete="off"
    >

    <button
      class="login"
      type="button"
      onclick="loginAdmin()"
    >
      🔓 ANTRE NAN ADMIN
    </button>

  </div>


  <!-- ADMIN AREA -->

  <div id="adminArea">

    <div id="message"></div>


    <!-- SITE CONTROL -->

    <div class="card">

      <h3>🌐 Kontwòl Sit la</h3>

      <div
        id="siteStatus"
        class="status status-on"
      >
        🟢 SIT LA ON
      </div>

      <button
        class="on"
        type="button"
        onclick="siteOn()"
      >
        🟢 SIT ON
      </button>

      <button
        class="off"
        type="button"
        onclick="showOffArea()"
      >
        🔴 SIT OFF
      </button>


      <div id="offArea">

        <p>
          Chwazi youn oswa ekri pwòp mesaj ou:
        </p>

        <button
          class="message-choice"
          type="button"
          onclick="setOffMessage('⏳ Sit la ap disponib talè.')"
        >
          ⏳ Sit la ap disponib talè.
        </button>

        <button
          class="message-choice"
          type="button"
          onclick="setOffMessage('🔧 Gen kèk bagay k ap ranje sou sit la. Li ap disponib talè.')"
        >
          🔧 Gen kèk bagay k ap ranje sou sit la. Li ap disponib talè.
        </button>

        <textarea
          id="customMessage"
          placeholder="✍️ Ekri pwòp mesaj OFF ou..."
        ></textarea>

        <button
          class="off"
          type="button"
          onclick="setCustomOffMessage()"
        >
          🔴 METE SIT LA OFF AK MESAJ SA
        </button>

      </div>

    </div>


    <!-- ORDERS -->

    <div class="card">

      <h3>📋 KÒMAND YO</h3>

      <button
        class="refresh"
        type="button"
        onclick="loadOrders()"
      >
        🔄 RAFRECHI KÒMAND YO
      </button>

      <!-- PANÈL NAVIGASYON FLÈCH -->
      <div id="paginationNav" class="pagination-container" style="display: none;">
        <button id="prevBtn" class="pagination-btn" type="button" onclick="changeOrderPage(-1)">⬅️ Prèsedan</button>
        <span id="pageInfo" class="pagination-info">1 / 1</span>
        <button id="nextBtn" class="pagination-btn" type="button" onclick="changeOrderPage(1)">Swivan ➡️</button>
      </div>

      <div id="orders">
        <div class="empty">
          Peze RAFRECHI pou chaje kòmand yo.
        </div>
      </div>

    </div>

  </div>

</div>


<script>

const API = "/.netlify/functions";

let ADMIN_TOKEN = "";
let allOrdersList = [];
let currentOrderIndex = 0;


/* =========================
   MESSAGE
========================= */

function showMessage(text, color = "#00e5ff") {

  const box =
    document.getElementById("message");

  box.style.display = "block";
  box.style.color = color;
  box.textContent = text;

}


/* =========================
   LOGIN
========================= */

async function loginAdmin() {

  const token =
    document.getElementById("adminToken").value.trim();

  if (!token) {

    alert("⚠️ Tanpri antre ADMIN_TOKEN ou.");

    return;
  }

  ADMIN_TOKEN = token;

  try {

    const response =
      await fetch(`${API}/get-orders`, {
        method: "GET",
        headers: {
          "x-admin-token": ADMIN_TOKEN,
          "Accept": "application/json"
        },
        cache: "no-store"
      });

    if (response.status === 401) {

      ADMIN_TOKEN = "";

      alert("❌ ADMIN_TOKEN la pa bon.");

      return;
    }

    let result = null;

    try {

      result = await response.json();

    } catch (error) {

      result = null;

    }

    if (!response.ok) {

      const backendMessage =
        result &&
        result.message
          ? result.message
          : "Backend error: HTTP " + response.status;

      alert("❌ " + backendMessage);

      return;
    }

    if (!result || result.success !== true) {

      alert(
        "❌ Backend lan pa valide koneksyon an."
      );

      return;
    }

    /* LOGIN SIKSÈ */

    document.getElementById(
      "loginBox"
    ).style.display = "none";

    document.getElementById(
      "adminArea"
    ).style.display = "block";

    showMessage(
      "✅ Admin konekte avèk siksè.",
      "#5ee39a"
    );

    await loadSiteStatus();

    allOrdersList = result.orders || [];
    currentOrderIndex = 0;
    renderOrders();

  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    alert(
      "❌ Pa kapab kontakte backend la. Verifye URL Function lan."
    );

  }

}


/* =========================
   SITE STATUS
========================= */

async function loadSiteStatus() {

  try {

    const response =
      await fetch(`${API}/site-status`, {
        method: "GET",
        cache: "no-store"
      });

    if (!response.ok) {

      throw new Error(
        "Site status HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    updateSiteDisplay(
      data.enabled !== false
    );

  } catch (error) {

    console.error(
      "SITE STATUS ERROR:",
      error
    );

  }

}


function updateSiteDisplay(isOpen) {

  const status =
    document.getElementById(
      "siteStatus"
    );

  if (isOpen) {

    status.className =
      "status status-on";

    status.textContent =
      "🟢 SIT LA ON";

  } else {

    status.className =
      "status status-off";

    status.textContent =
      "🔴 SIT LA OFF";

  }

}


/* =========================
   SHOW OFF AREA
========================= */

function showOffArea() {

  document.getElementById(
    "offArea"
  ).style.display = "block";

}


/* =========================
   SET OFF MESSAGE
========================= */

async function setOffMessage(message) {

  await saveSiteStatus(
    false,
    message
  );

}


/* =========================
   CUSTOM OFF MESSAGE
========================= */

async function setCustomOffMessage() {

  const message =
    document.getElementById(
      "customMessage"
    ).value.trim();

  if (!message) {

    alert(
      "⚠️ Tanpri ekri yon mesaj."
    );

    return;
  }

  await saveSiteStatus(
    false,
    message
  );

}


/* =========================
   SAVE SITE STATUS
========================= */

async function saveSiteStatus(
  enabled,
  message
) {

  if (!ADMIN_TOKEN) {

    alert(
      "❌ Admin pa konekte."
    );

    return;
  }

  try {

    const response =
      await fetch(`${API}/site-status`, {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json",
          "x-admin-token":
            ADMIN_TOKEN
        },
        body: JSON.stringify({
          enabled: enabled,
          message: message || ""
        })
      });

    let result = null;

    try {

      result =
        await response.json();

    } catch (error) {

      result = null;

    }

    if (!response.ok) {

      throw new Error(
        result &&
        result.message
          ? result.message
          : "HTTP " +
            response.status
      );

    }

    if (!result || !result.success) {

      throw new Error(
        "Backend lan pa konfime chanjman an."
      );

    }

    updateSiteDisplay(
      enabled
    );

    document.getElementById(
      "offArea"
    ).style.display = "none";

    document.getElementById(
      "customMessage"
    ).value = "";

    showMessage(
      enabled
        ? "🟢 Sit la ON."
        : "🔴 Sit la OFF. Mesaj la aktive.",
      enabled
        ? "#5ee39a"
        : "#ff7777"
    );

  } catch (error) {

    console.error(
      "SITE STATUS ERROR:",
      error
    );

    showMessage(
      "❌ " + error.message,
      "#ff4d4d"
    );

  }

}


/* =========================
   SIT ON
========================= */

async function siteOn() {

  await saveSiteStatus(
    true,
    ""
  );

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

  const ordersBox =
    document.getElementById(
      "orders"
    );

  ordersBox.innerHTML =
    '<div class="empty">⏳ Kòmand yo ap chaje...</div>';

  if (!ADMIN_TOKEN) {

    ordersBox.innerHTML =
      '<div class="empty">❌ Admin pa konekte.</div>';

    return;
  }

  try {

    const response =
      await fetch(`${API}/get-orders`, {
        method: "GET",
        headers: {
          "x-admin-token":
            ADMIN_TOKEN,
          "Accept":
            "application/json"
        },
        cache: "no-store"
      });

    let result = null;

    try {

      result =
        await response.json();

    } catch (error) {

      result = null;

    }

    if (response.status === 401) {

      ordersBox.innerHTML =
        '<div class="empty">❌ Token admin lan pa otorize.</div>';

      return;
    }

    if (!response.ok) {

      throw new Error(
        result &&
        result.message
          ? result.message
          : "HTTP " +
            response.status
      );

    }

    if (!result || !result.success) {

      throw new Error(
        "Backend lan pa konfime kòmand yo."
      );

    }

    allOrdersList = result.orders || [];
    currentOrderIndex = 0;
    renderOrders();

  } catch (error) {

    console.error(
      "LOAD ORDERS ERROR:",
      error
    );

    ordersBox.innerHTML =
      '<div class="empty">❌ ' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* =========================
   PAGINATION (FLÈCH)
========================= */

function changeOrderPage(direction) {

  currentOrderIndex += direction;

  if (currentOrderIndex < 0) {
    currentOrderIndex = 0;
  }

  if (currentOrderIndex >= allOrdersList.length) {
    currentOrderIndex = allOrdersList.length - 1;
  }

  renderOrders();

}


/* =========================
   RENDER ORDERS (AK FLÈCH)
========================= */

function renderOrders() {

  const ordersBox =
    document.getElementById(
      "orders"
    );

  const paginationNav =
    document.getElementById(
      "paginationNav"
    );

  if (!allOrdersList.length) {

    paginationNav.style.display = "none";

    ordersBox.innerHTML =
      '<div class="empty">📭 Pa gen kòmand pou kounye a.</div>';

    return;
  }

  /*
    Triye pou kòmand an atant (pending) parèt an premye
  */

  allOrdersList.sort((a, b) => {
    if (a.status === 'pending' && b.status !== 'pending') return -1;
    if (a.status !== 'pending' && b.status === 'pending') return 1;
    return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
  });

  /*
    Afiche Navigasyon an
  */

  paginationNav.style.display = "flex";

  document.getElementById("pageInfo").textContent =
    `${currentOrderIndex + 1} / ${allOrdersList.length}`;

  document.getElementById("prevBtn").disabled = (currentOrderIndex === 0);

  document.getElementById("nextBtn").disabled = (currentOrderIndex === allOrdersList.length - 1);

  ordersBox.innerHTML = "";

  const order = allOrdersList[currentOrderIndex];

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "order";

  const date =
    order.createdAt
      ? new Date(
          order.createdAt
        ).toLocaleString()
      : "N/A";

  let statusText =
    "🟡 AN ATANT";

  if (
    order.status ===
    "processing"
  ) {

    statusText =
      "⏳ AP TRAITE";

  }

  if (
    order.status ===
    "failed"
  ) {

    statusText =
      "❌ ÉCHEC";

  }

  if (
    order.status ===
    "success"
  ) {

    statusText =
      "✅ SIKSÈ";

  }

  let buttons = "";

  if (
    order.status ===
    "pending"
  ) {

    buttons = `

      <div class="order-buttons">

        <button
          class="process"
          type="button"
          onclick="updateOrder(
            '${escapeJs(order.id || "")}',
            'processing'
          )"
        >
          ✅ VALIDÉ
        </button>

        <button
          class="failed"
          type="button"
          onclick="updateOrder(
            '${escapeJs(order.id || "")}',
            'failed'
          )"
        >
          ❌ ÉCHEC
        </button>

      </div>

    `;

  }

  div.innerHTML = `

    <div class="status">
      ${escapeHtml(statusText)}
    </div>

    <div class="line">
      <span>🆔 ID:</span>
      <strong>
        ${escapeHtml(order.id || "")}
      </strong>
    </div>

    <div class="line">
      <span>🎮 UID:</span>
      <strong>
        ${escapeHtml(order.uid || "")}
      </strong>
    </div>

    <div class="line">
      <span>💎 Pack:</span>
      <strong class="pack">
        ${escapeHtml(order.pack || "")}
      </strong>
    </div>

    <div class="line">
      <span>💰 Pri:</span>
      <strong class="price">
        ${escapeHtml(
          String(order.price || "")
        )} GDS
      </strong>
    </div>

    <div class="line">
      <span>📱 Nimewo:</span>
      <strong>
        ${escapeHtml(
          order.senderNumber || ""
        )}
      </strong>
    </div>

    <div class="line">
      <span>🌎 Server:</span>
      <strong>
        ${escapeHtml(
          order.server || ""
        )}
      </strong>
    </div>

    <div class="line">
      <span>🕐 Kòmand:</span>
      <strong>
        ${escapeHtml(date)}
      </strong>
    </div>

    ${buttons}

  `;

  ordersBox.appendChild(
    div
  );

}


/* =========================
   UPDATE ORDER
========================= */

async function updateOrder(
  id,
  status
) {

  if (!ADMIN_TOKEN) {

    alert(
      "❌ Admin pa konekte."
    );

    return;
  }

  try {

    /* ===================================================
       PLAS POU API DYAMAN AN LÈ W PARE:
       Si status === 'processing', ou ka fè yon fetch()
       voye bay API dyaman Free Fire ou an la anvan
       voye rezilta a bay update-order Netlify Function la.
    =================================================== */

    const response =
      await fetch(`${API}/update-order`, {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json",
          "x-admin-token":
            ADMIN_TOKEN
        },
        body: JSON.stringify({
          id: id,
          status: status
        })
      });

    let result = null;

    try {

      result =
        await response.json();

    } catch (error) {

      result = null;

    }

    if (!response.ok) {

      throw new Error(
        result &&
        result.message
          ? result.message
          : "HTTP " +
            response.status
      );

    }

    if (!result || !result.success) {

      throw new Error(
        "Backend lan pa konfime chanjman an."
      );

    }

    showMessage(
      status === "processing"
        ? "⏳ Kòmand lan ap trete."
        : "❌ Kòmand lan make kòm échec.",
      status === "processing"
        ? "#00e5ff"
        : "#ff7777"
    );

    await loadOrders();

  } catch (error) {

    console.error(
      "UPDATE ORDER ERROR:",
      error
    );

    showMessage(
      "❌ " +
      error.message,
      "#ff4d4d"
    );

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   ESCAPE JAVASCRIPT
========================= */

function escapeJs(value) {

  return String(value)
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      "\n",
      "\\n"
    )
    .replaceAll(
      "\r",
      "\\r"
    );

}

</script>

</body>
</html>
