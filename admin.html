const API = "/api";

let ADMIN_TOKEN = "";

let allOrdersList = [];

let currentIndex = 0;

let loadingOrders = false;


/*
==================================================
MESSAGE
==================================================
*/

function showMessage(
text,
color = "#00e5ff"
) {

const box =
document.getElementById("message");

box.style.display = "block";

box.style.color = color;

box.textContent = text;

}


/*
==================================================
LOGIN
==================================================
*/

async function loginAdmin() {

const token =
document
.getElementById("adminToken")
.value
.trim();

if (!token) {

alert(
"⚠️ Tanpri antre ADMIN_TOKEN ou."
);

return;

}

ADMIN_TOKEN = token;

try {

const response =
await fetch(
`${API}/get-orders`,
{
method: "GET",

headers: {
"x-admin-token":
ADMIN_TOKEN,

"Accept":
"application/json"
},

cache: "no-store"
}
);


const result =
await response.json();


if (response.status === 401) {

ADMIN_TOKEN = "";

alert(
"❌ ADMIN_TOKEN la pa bon."
);

return;

}


if (
!response.ok ||
result.success !== true
) {

throw new Error(
result.message ||
"HTTP " +
response.status
);

}


/*
 * Kounye a nou pran tout kòmand
 * ki deja egziste nan backend lan.
 *
 * Sa pèmèt SIKSÈ ak ÉCHEC rete
 * apre yon nouvo koneksyon.
 */

allOrdersList =
normalizeOrders(
result.orders || []
);


document
.getElementById("loginBox")
.style.display = "none";


document
.getElementById("adminArea")
.style.display = "block";


showMessage(
"✅ Admin konekte avèk siksè.",
"#5ee39a"
);


await loadSiteStatus();

renderAllLists();


} catch (error) {

console.error(
"LOGIN ERROR:",
error
);

ADMIN_TOKEN = "";

alert(
"❌ " +
error.message
);

}

}


/*
==================================================
NORMALIZE ORDERS
==================================================
*/

function normalizeOrders(orders) {

const map = new Map();

for (const order of orders) {

if (!order || !order.id) {
continue;
}

map.set(
String(order.id),
{
...order
}
);

}

return Array.from(
map.values()
);

}


/*
==================================================
SITE STATUS
==================================================
*/

async function loadSiteStatus() {

try {

const response =
await fetch(
`${API}/site-status`,
{
method: "GET",
cache: "no-store"
}
);


const data =
await response.json();


updateSiteDisplay(
data.enabled !== false
);


} catch (error) {

console.error(
"SITE STATUS ERROR:",
error
);

}

}


function updateSiteDisplay(
isOpen
) {

const status =
document.getElementById(
"siteStatus"
);


if (isOpen) {

status.className =
"status status-on";

status.textContent =
"🟢 SIT LA ON";

} else {

status.className =
"status status-off";

status.textContent =
"🔴 SIT LA OFF";

}

}


function showOffArea() {

document
.getElementById("offArea")
.style.display = "block";

}


async function setOffMessage(
message
) {

await saveSiteStatus(
false,
message
);

}


async function setCustomOffMessage() {

const message =
document
.getElementById(
"customMessage"
)
.value
.trim();


if (!message) {

alert(
"⚠️ Tanpri ekri yon mesaj."
);

return;

}


await saveSiteStatus(
false,
message
);

}


async function saveSiteStatus(
enabled,
message
) {

if (!ADMIN_TOKEN) {
return;
}

try {

const response =
await fetch(
`${API}/site-status`,
{
method: "POST",

headers: {
"Content-Type":
"application/json",

"x-admin-token":
ADMIN_TOKEN
},

body:
JSON.stringify({
enabled,
message:
message || ""
})
}
);


const result =
await response.json();


if (
!response.ok ||
!result.success
) {

throw new Error(
result.message ||
"Erè backend."
);

}


updateSiteDisplay(
enabled
);


document
.getElementById("offArea")
.style.display = "none";


document
.getElementById("customMessage")
.value = "";


showMessage(
enabled
? "🟢 Sit la ON."
: "🔴 Sit la OFF. Mesaj la aktive.",

enabled
? "#5ee39a"
: "#ff7777"
);


} catch (error) {

showMessage(
"❌ " +
error.message,
"#ff4d4d"
);

}

}


async function siteOn() {

await saveSiteStatus(
true,
""
);

}


/*
==================================================
LOAD ORDERS / REFRESH
==================================================

IMPORTANT:

Refresh pa efase lis lokal la.

Nou pran sa backend lan retounen,
epi nou fè merge sou ID yo.

Yon kòmand ki deja:

success
failed
processing

pap janm vin pending jis paske
nou peze refresh.
==================================================
*/

async function loadOrders() {

if (!ADMIN_TOKEN) {
return;
}


/*
 * Evite plizyè refresh an menm tan.
 */
if (loadingOrders) {
return;
}

loadingOrders = true;


const refreshBtn =
document.getElementById(
"refreshBtn"
);

refreshBtn.disabled = true;

refreshBtn.textContent =
"⏳ AP CHÈCHE NOUVO KÒMAND...";


try {

const response =
await fetch(
`${API}/get-orders?t=${Date.now()}`,
{
method: "GET",

headers: {
"x-admin-token":
ADMIN_TOKEN,

"Accept":
"application/json",

"Cache-Control":
"no-cache"
},

cache: "no-store"
}
);


const result =
await response.json();


if (
!response.ok ||
!result.success
) {

throw new Error(
result.message ||
"Erè backend."
);

}


const serverOrders =
normalizeOrders(
result.orders || []
);


/*
 * Map ansyen lis la.
 */
const existing =
new Map();

for (
const order of allOrdersList
) {

if (
order &&
order.id
) {

existing.set(
String(order.id),
order
);

}

}


/*
 * Merge server lan.
 *
 * Backend lan se sous verite.
 * Men nou pa pèmèt yon ansyen
 * status final tounen pending
 * akoz yon refresh.
 */
for (
const serverOrder of serverOrders
) {

const key =
String(serverOrder.id);

const oldOrder =
existing.get(key);


/*
 * Si nou te deja mete kòmand lan
 * nan final status lokalman,
 * epi server lan ta retounen yon
 * ansyen pending akoz yon pwoblèm
 * cache, nou konsève final status la.
 */
if (
oldOrder &&
(
oldOrder.status === "failed" ||
oldOrder.status === "success"
)
&&
(
serverOrder.status === "pending" ||
serverOrder.status === "processing"
)
) {

existing.set(
key,
{
...serverOrder,
status:
oldOrder.status,

customerMessage:
oldOrder.customerMessage ||
serverOrder.customerMessage
}
);

continue;

}


/*
 * Sinon pran vèsyon server lan.
 */
existing.set(
key,
{
...oldOrder,
...serverOrder
}
);

}


/*
 * Fè lis final la.
 */
allOrdersList =
Array.from(
existing.values()
);


/*
 * Pi nouvo kòmand an premye.
 */
allOrdersList.sort(
(a, b) =>
new Date(
b.createdAt || 0
) -
new Date(
a.createdAt || 0
)
);


renderAllLists();


showMessage(
"🔄 Kòmand yo rafrechi. Nouvo kòmand yo chaje.",
"#00e5ff"
);


} catch (error) {

console.error(
"LOAD ORDERS ERROR:",
error
);

showMessage(
"❌ " +
error.message,
"#ff4d4d"
);

} finally {

loadingOrders = false;

refreshBtn.disabled = false;

refreshBtn.textContent =
"🔄 RAFRECHI KÒMAND YO";

}

}


/*
==================================================
RENDER ALL LISTS
==================================================
*/

function renderAllLists() {

const pending =
allOrdersList.filter(
o =>
o.status === "pending"
);


const failed =
allOrdersList.filter(
o =>
o.status === "failed"
);


const success =
allOrdersList.filter(
o =>
o.status === "success"
);


const processing =
allOrdersList.filter(
o =>
o.status === "processing"
);


/*
 * Processing antre nan SIKSÈ
 * kòm kòmand ki deja valide.
 */
const successTotal =
success.length +
processing.length;


document
.getElementById(
"pendingCount"
)
.textContent =
pending.length;


document
.getElementById(
"failedCount"
)
.textContent =
failed.length;


document
.getElementById(
"successCount"
)
.textContent =
successTotal;


const paginationBox =
document.getElementById(
"paginationBox"
);


if (pending.length === 0) {

paginationBox.style.display =
"none";


document
.getElementById(
"pendingList"
)
.innerHTML =
'<div class="empty">📭 Pa gen kòmand an atant pou kounye a.</div>';

return;

}


paginationBox.style.display =
"flex";


if (
currentIndex >=
pending.length
) {

currentIndex =
pending.length - 1;

}


if (
currentIndex < 0
) {

currentIndex = 0;

}


document
.getElementById(
"pageIndicator"
)
.textContent =
`${currentIndex + 1} / ${pending.length}`;


document
.getElementById(
"prevBtn"
)
.disabled =
currentIndex === 0;


document
.getElementById(
"nextBtn"
)
.disabled =
currentIndex ===
pending.length - 1;


renderPendingOrder(
pending[currentIndex]
);

}


/*
==================================================
PENDING ORDER
==================================================
*/

function renderPendingOrder(
order
) {

const box =
document.getElementById(
"pendingList"
);

box.innerHTML = "";

const div =
document.createElement(
"div"
);

div.className =
"order";


const date =
order.createdAt
? new Date(
order.createdAt
).toLocaleString()
: "N/A";


const userTxCode =
order.transactionId ||
order.transaction_id ||
order.transId ||
order.code ||
"Pa gen kòd";


div.innerHTML = `

<div class="status">
🟡 AN ATANT
</div>

<div class="line">
<span>🆔 ID:</span>
<strong>
${escapeHtml(
order.id || ""
)}
</strong>
</div>

<div class="line">
<span>🎮 UID:</span>
<strong>
${escapeHtml(
order.uid || ""
)}
</strong>
</div>

<div class="line">
<span>💎 Pack:</span>
<strong class="pack">
${escapeHtml(
order.pack || ""
)}
</strong>
</div>

<div class="line">
<span>💰 Pri:</span>
<strong class="price">
${escapeHtml(
String(
order.price || ""
)
)}
GDS
</strong>
</div>

<div class="line">
<span>📱 Nimewo/Non:</span>
<strong>
${escapeHtml(
order.senderNumber || ""
)}
</strong>
</div>

<div class="tx-highlight">

<div
style="
color:#aaa;
font-size:12px;
"
>
🧾 KÒD TRANZAKSYON
(NATCASH/MONCASH):
</div>

<strong
style="
color:#ffd54f;
font-size:16px;
"
>
${escapeHtml(
userTxCode
)}
</strong>

</div>

<div class="line">
<span>🌎 Server:</span>
<strong>
${escapeHtml(
order.server || ""
)}
</strong>
</div>

<div class="line">
<span>🕐 Kòmand:</span>
<strong>
${escapeHtml(
date
)}
</strong>
</div>


<div class="order-buttons">

<button
class="process"
onclick="
updateOrder(
'${escapeJs(
order.id || ""
)}',
'processing'
)
"
>
✅ VALIDÉ
</button>


<button
class="failed"
onclick="
handleFailOrder(
'${escapeJs(
order.id || ""
)}'
)
"
>
❌ ÉCHEC
</button>

</div>

`;


box.appendChild(div);

}


/*
==================================================
PAGE
==================================================
*/

function changePage(
direction
) {

const pending =
allOrdersList.filter(
o =>
o.status === "pending"
);

currentIndex +=
direction;

if (
currentIndex < 0
) {
currentIndex = 0;
}

if (
currentIndex >= pending.length
) {
currentIndex =
pending.length - 1;
}

renderAllLists();

}


/*
==================================================
ECHEC
==================================================
*/

function handleFailOrder(
id
) {

const reason =
prompt(
"🔴 Antre mesaj echèk la pou kliyan an:",
"Nou pa resevwa peman an."
);


if (reason === null) {
return;
}


updateOrder(
id,
"failed",
reason.trim() ||
"Nou pa resevwa peman an."
);

}


/*
==================================================
UPDATE ORDER
==================================================
*/

async function updateOrder(
id,
status,
customerMessage = ""
) {

if (!ADMIN_TOKEN) {

alert(
"❌ Admin pa konekte."
);

return;

}


const target =
allOrdersList.find(
o =>
String(o.id) ===
String(id)
);


if (!target) {

alert(
"❌ Kòmand lan pa jwenn."
);

return;

}


/*
 * Chanje status lokalman touswit.
 *
 * Sa vle di lè ou peze ÉCHEC
 * oswa VALIDÉ, kòmand lan soti
 * nan AN ATANT imedyatman.
 */

target.status =
status;

target.customerMessage =
customerMessage;

target.updatedAt =
new Date().toISOString();


renderAllLists();


if (
status === "failed"
) {

showMessage(
"❌ Kòmand lan voye nan ÉCHEC avèk siksè!",
"#ff7777"
);

} else {

showMessage(
"✅ Kòmand lan VALIDÉ. Li pap retounen AN ATANT apre refresh.",
"#5ee39a"
);

}


try {

const response =
await fetch(
`${API}/update-order`,
{
method: "POST",

headers: {
"Content-Type":
"application/json",

"x-admin-token":
ADMIN_TOKEN
},

body:
JSON.stringify({
id,
status,
customerMessage
})
}
);


const result =
await response.json();


if (
!response.ok ||
!result.success
) {

throw new Error(
result.message ||
"Erè backend."
);

}


/*
 * Pran vèsyon backend lan
 * sèlman pou kòmand sa a.
 */
if (
result.order
) {

const index =
allOrdersList.findIndex(
o =>
String(o.id) ===
String(id)
);

if (index !== -1) {

allOrdersList[index] = {
...allOrdersList[index],
...result.order
};

}

renderAllLists();

}


} catch (error) {

console.error(
"UPDATE ERROR:",
error
);


/*
 * Si backend lan echwe,
 * mete yon mesaj pou admin nan.
 */
showMessage(
"⚠️ Backend lan pa konfime chanjman an: " +
error.message,
"#ff4d4d"
);

}

}


/*
==================================================
CLEAR ALL
==================================================
*/

async function clearAllOrdersByStatus(
statusType
) {

const targetOrders =
allOrdersList.filter(
o =>
statusType === "success"
?
(
o.status === "success" ||
o.status === "processing"
)
:
o.status === "failed"
);


if (!targetOrders.length) {

alert(
`⚠️ Pa gen okenn kòmand nan kategori ${
statusType === "success"
? "SIKSÈ"
: "ÉCHEC"
} pou efase.`
);

return;

}


if (
!confirm(
`⚠️ Èske ou sèten ou vle efase TOUT (${targetOrders.length}) kòmand ${
statusType === "success"
? "SIKSÈ"
: "ÉCHEC"
} yo?`
)
) {

return;

}


/*
 * Efase lokalman.
 */
const idsToDelete =
new Set(
targetOrders.map(
o =>
String(o.id)
)
);


allOrdersList =
allOrdersList.filter(
o =>
!idsToDelete.has(
String(o.id)
)
);


renderAllLists();


/*
 * Efase nan backend.
 */
for (
const order of targetOrders
) {

try {

const response =
await fetch(
`${API}/delete-order`,
{
method: "POST",

headers: {
"Content-Type":
"application/json",

"x-admin-token":
ADMIN_TOKEN
},

body:
JSON.stringify({
id: order.id
})
}
);


if (!response.ok) {

console.error(
"DELETE FAILED:",
order.id
);

}

} catch (error) {

console.error(
"DELETE ERROR:",
order.id,
error
);

}

}


showMessage(
`🗑️ Kòmand ${
statusType === "success"
? "Siksè"
: "Échec"
} yo efase nèt!`,
"#5ee39a"
);

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(
value
) {

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/*
==================================================
ESCAPE JS
==================================================
*/

function escapeJs(
value
) {

return String(value)

.replaceAll(
"\\",
"\\\\"
)

.replaceAll(
"'",
"\\'"
)

.replaceAll(
"\n",
"\\n"
)

.replaceAll(
"\r",
"\\r"
);

}
