<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>True Alpha Admin</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #0b0b12;
  color: white;
  padding: 15px;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #00e5ff;
  margin-bottom: 20px;
}

.card {
  background: #151520;
  border: 1px solid #303044;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 15px;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 9px;
  border: 1px solid #36364a;
  background: #0e0e17;
  color: white;
  outline: none;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.login {
  background: #00e5ff;
  color: #001014;
}

.on {
  background: #00c853;
  color: white;
}

.off {
  background: #d32f2f;
  color: white;
}

.process {
  background: #00c853;
  color: white;
}

.failed {
  background: #d32f2f;
  color: white;
}

.refresh {
  background: #36364a;
  color: white;
}

.delete-btn-all {
  background: #9b2226;
  color: white;
  padding: 5px 8px;
  font-size: 10px;
  border-radius: 5px;
  margin-top: 5px;
}

.message-choice {
  background: #0e0e17;
  border: 1px solid #36364a;
  color: white;
  text-align: left;
}

.status {
  padding: 10px;
  border-radius: 9px;
  text-align: center;
  font-weight: bold;
  margin-bottom: 10px;
}

.status-on {
  background: #123d25;
  color: #5ee39a;
}

.status-off {
  background: #4a1717;
  color: #ff7777;
}

.order {
  background: #0e0e17;
  border: 1px solid #303044;
  border-radius: 12px;
  padding: 13px;
  margin-top: 10px;
}

.line {
  margin: 7px 0;
  font-size: 14px;
}

.line span {
  color: #aaa;
}

.pack {
  color: #00e5ff;
}

.price {
  color: #00e5ff;
  font-weight: bold;
}

.order-buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.order-buttons button {
  flex: 1;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 15px;
}

.stat {
  background: #0e0e17;
  border: 1px solid #303044;
  border-radius: 10px;
  padding: 12px 5px;
  text-align: center;
}

.stat-number {
  display: block;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 4px;
}

.stat-label {
  font-size: 11px;
  font-weight: bold;
}

.pending-number {
  color: #ffd54f;
}

.success-number {
  color: #5ee39a;
}

.failed-number {
  color: #ff7777;
}

.section-title {
  margin-top: 20px;
  margin-bottom: 8px;
  padding: 10px;
  border-radius: 9px;
  background: #10101b;
  font-weight: bold;
}

.pending-title {
  color: #ffd54f;
}

.list {
  margin-bottom: 15px;
}

#adminArea {
  display: none;
}

#offArea {
  display: none;
  margin-top: 10px;
}

#message {
  display: none;
  background: #151520;
  border-radius: 9px;
  padding: 12px;
  text-align: center;
  margin-bottom: 15px;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 20px;
}

</style>

</head>


<body>

<div class="container">

<h1>💎 TRUE ALPHA ADMIN</h1>


<!-- LOGIN -->

<div
  class="card"
  id="loginBox"
>

<h3>🔐 Admin Login</h3>

<input
  type="password"
  id="adminToken"
  placeholder="Antre ADMIN_TOKEN ou"
  autocomplete="off"
>

<button
  class="login"
  onclick="loginAdmin()"
>

🔓 ANTRE NAN ADMIN

</button>

</div>


<!-- ADMIN -->

<div id="adminArea">

<div id="message"></div>


<!-- SITE CONTROL -->

<div class="card">

<h3>🌐 Kontwòl Sit la</h3>

<div
  id="siteStatus"
  class="status status-on"
>
🟢 SIT LA ON
</div>


<button
  class="on"
  onclick="siteOn()"
>
🟢 SIT ON
</button>


<button
  class="off"
  onclick="showOffArea()"
>
🔴 SIT OFF
</button>


<div id="offArea">

<p>
Chwazi youn oswa ekri pwòp mesaj ou:
</p>


<button
  class="message-choice"
  onclick="setOffMessage(
    '⏳ Sit la ap disponib talè.'
  )"
>
⏳ Sit la ap disponib talè.
</button>


<button
  class="message-choice"
  onclick="setOffMessage(
    '🔧 Gen kèk bagay k ap ranje sou sit la. Li ap disponib talè.'
  )"
>
🔧 Gen kèk bagay k ap ranje sou sit la. Li ap disponib talè.
</button>


<textarea
  id="customMessage"
  placeholder="✍️ Ekri pwòp mesaj OFF ou..."
></textarea>


<button
  class="off"
  onclick="setCustomOffMessage()"
>
🔴 METE SIT LA OFF AK MESAJ SA
</button>

</div>

</div>


<!-- ORDERS -->

<div class="card">

<h3>📋 KÒMAND YO</h3>


<!-- STATS -->

<div class="stats">

<div class="stat">

<span
  id="pendingCount"
  class="stat-number pending-number"
>
0
</span>

<span class="stat-label">
🟡 AN ATANT
</span>

</div>


<!-- SIKSÈ AK BOUTON EFASE -->
<div class="stat">

<span
  id="successCount"
  class="stat-number success-number"
>
0
</span>

<span class="stat-label">
✅ SIKSÈ
</span>

<button class="delete-btn-all" onclick="clearAllOrdersByStatus('success')">🗑️ Efase tout</button>

</div>


<!-- ÈCHÈK AK BOUTON EFASE -->
<div class="stat">

<span
  id="failedCount"
  class="stat-number failed-number"
>
0
</span>

<span class="stat-label">
❌ ÉCHEC
</span>

<button class="delete-btn-all" onclick="clearAllOrdersByStatus('failed')">🗑️ Efase tout</button>

</div>

</div>


<button
  class="refresh"
  onclick="loadOrders()"
>
🔄 RAFRECHI KÒMAND YO
</button>


<!-- AN ATANT SÈLMAN -->

<div
  class="section-title pending-title"
>
🟡 KÒMAND AN ATANT
</div>

<div
  id="pendingList"
  class="list"
>
<div class="empty">
Pa gen kòmand an atant.
</div>
</div>

</div>

</div>

</div>


<script>

const API = "/api";

let ADMIN_TOKEN = "";

let allOrdersList = [];


/* =====================================
   MESSAGE
===================================== */

function showMessage(
  text,
  color = "#00e5ff"
) {

  const box =
    document.getElementById(
      "message"
    );

  box.style.display = "block";

  box.style.color = color;

  box.textContent = text;
}


/* =====================================
   LOGIN
===================================== */

async function loginAdmin() {

  const token =
    document
      .getElementById(
        "adminToken"
      )
      .value
      .trim();


  if (!token) {

    alert(
      "⚠️ Tanpri antre ADMIN_TOKEN ou."
    );

    return;
  }


  ADMIN_TOKEN = token;


  try {

    const response =
      await fetch(
        `${API}/get-orders`,
        {
          method: "GET",

          headers: {
            "x-admin-token":
              ADMIN_TOKEN,

            "Accept":
              "application/json"
          },

          cache: "no-store"
        }
      );


    const result =
      await response.json();


    if (
      response.status === 401
    ) {

      ADMIN_TOKEN = "";

      alert(
        "❌ ADMIN_TOKEN la pa bon."
      );

      return;
    }


    if (!response.ok) {

      throw new Error(
        result.message ||
        "HTTP " +
        response.status
      );
    }


    if (
      !result ||
      result.success !== true
    ) {

      throw new Error(
        "Backend lan pa valide koneksyon an."
      );
    }


    document.getElementById(
      "loginBox"
    ).style.display = "none";


    document.getElementById(
      "adminArea"
    ).style.display = "block";


    showMessage(
      "✅ Admin konekte avèk siksè.",
      "#5ee39a"
    );


    await loadSiteStatus();


    allOrdersList =
      result.orders || [];


    renderAllLists();

  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    alert(
      "❌ " +
      error.message
    );
  }
}


/* =====================================
   SITE STATUS
===================================== */

async function loadSiteStatus() {

  try {

    const response =
      await fetch(
        `${API}/site-status`,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    updateSiteDisplay(
      data.enabled !== false
    );

  } catch (error) {

    console.error(
      "SITE STATUS ERROR:",
      error
    );
  }
}


function updateSiteDisplay(
  isOpen
) {

  const status =
    document.getElementById(
      "siteStatus"
    );


  if (isOpen) {

    status.className =
      "status status-on";

    status.textContent =
      "🟢 SIT LA ON";

  } else {

    status.className =
      "status status-off";

    status.textContent =
      "🔴 SIT LA OFF";
  }
}


function showOffArea() {

  document.getElementById(
    "offArea"
  ).style.display =
    "block";
}


async function setOffMessage(
  message
) {

  await saveSiteStatus(
    false,
    message
  );
}


async function setCustomOffMessage() {

  const message =
    document
      .getElementById(
        "customMessage"
      )
      .value
      .trim();


  if (!message) {

    alert(
      "⚠️ Tanpri ekri yon mesaj."
    );

    return;
  }


  await saveSiteStatus(
    false,
    message
  );
}


async function saveSiteStatus(
  enabled,
  message
) {

  if (!ADMIN_TOKEN) {

    alert(
      "❌ Admin pa konekte."
    );

    return;
  }


  try {

    const response =
      await fetch(
        `${API}/site-status`,
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-admin-token":
              ADMIN_TOKEN
          },

          body:
            JSON.stringify({
              enabled,
              message:
                message || ""
            })
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.message ||
        "HTTP " +
        response.status
      );
    }


    if (!result.success) {

      throw new Error(
        "Backend lan pa konfime chanjman an."
      );
    }


    updateSiteDisplay(
      enabled
    );


    document.getElementById(
      "offArea"
    ).style.display =
      "none";


    document.getElementById(
      "customMessage"
    ).value = "";


    showMessage(

      enabled
        ? "🟢 Sit la ON."
        : "🔴 Sit la OFF. Mesaj la aktive.",

      enabled
        ? "#5ee39a"
        : "#ff7777"
    );


  } catch (error) {

    console.error(
      "SITE STATUS ERROR:",
      error
    );


    showMessage(
      "❌ " +
      error.message,
      "#ff4d4d"
    );
  }
}


async function siteOn() {

  await saveSiteStatus(
    true,
    ""
  );
}


/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders() {

  if (!ADMIN_TOKEN) {

    return;
  }


  try {

    const response =
      await fetch(
        `${API}/get-orders`,
        {
          method: "GET",

          headers: {

            "x-admin-token":
              ADMIN_TOKEN,

            "Accept":
              "application/json"
          },

          cache: "no-store"
        }
      );


    const result =
      await response.json();


    if (
      response.status === 401
    ) {

      alert(
        "❌ Token admin lan pa otorize."
      );

      return;
    }


    if (!response.ok) {

      throw new Error(
        result.message ||
        "HTTP " +
        response.status
      );
    }


    allOrdersList =
      result.orders || [];


    renderAllLists();


  } catch (error) {

    console.error(
      "LOAD ORDERS ERROR:",
      error
    );


    showMessage(
      "❌ " +
      error.message,
      "#ff4d4d"
    );
  }
}


/* =====================================
   RENDER ALL LISTS
===================================== */

function renderAllLists() {

  const pending =
    allOrdersList.filter(
      order =>
        order.status ===
        "pending"
    );


  const failed =
    allOrdersList.filter(
      order =>
        order.status ===
        "failed"
    );


  const success =
    allOrdersList.filter(
      order =>
        order.status ===
        "success"
    );


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending.length;


  document.getElementById(
    "failedCount"
  ).textContent =
    failed.length;


  document.getElementById(
    "successCount"
  ).textContent =
    success.length;


  renderList(
    pending,
    "pendingList"
  );
}


/* =====================================
   RENDER PENDING LIST
===================================== */

function renderList(
  orders,
  containerId
) {

  const box =
    document.getElementById(
      containerId
    );


  if (!orders.length) {

    box.innerHTML =
      '<div class="empty">📭 Pa gen kòmand an atant pou kounye a.</div>';

    return;
  }


  orders.sort(
    (a, b) =>
      new Date(
        b.createdAt || 0
      ) -
      new Date(
        a.createdAt || 0
      )
  );


  box.innerHTML = "";


  for (
    const order of orders
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "order";


    const date =
      order.createdAt
        ? new Date(
            order.createdAt
          ).toLocaleString()
        : "N/A";


    const statusText =
      "🟡 AN ATANT";


    const buttons = `
      <div class="order-buttons">

        <button
          class="process"
          onclick="updateOrder(
            '${escapeJs(
              order.id || ""
            )}',
            'processing'
          )"
        >
          ✅ VALIDÉ
        </button>

        <button
          class="failed"
          onclick="updateOrder(
            '${escapeJs(
              order.id || ""
            )}',
            'failed'
          )"
        >
          ❌ ÉCHEC
        </button>

      </div>
    `;


    div.innerHTML = `

      <div class="status">
        ${escapeHtml(
          statusText
        )}
      </div>


      <div class="line">
        <span>🆔 ID:</span>
        <strong>
          ${escapeHtml(
            order.id || ""
          )}
        </strong>
      </div>


      <div class="line">
        <span>🎮 UID:</span>
        <strong>
          ${escapeHtml(
            order.uid || ""
          )}
        </strong>
      </div>


      <div class="line">
        <span>💎 Pack:</span>
        <strong class="pack">
          ${escapeHtml(
            order.pack || ""
          )}
        </strong>
      </div>


      <div class="line">
        <span>💰 Pri:</span>
        <strong class="price">
          ${escapeHtml(
            String(
              order.price || ""
            )
          )}
          GDS
        </strong>
      </div>


      <div class="line">
        <span>📱 Nimewo/Non:</span>
        <strong>
          ${escapeHtml(
            order.senderNumber || ""
          )}
        </strong>
      </div>


      <div class="line">
        <span>🧾 ID Tranzaksyon:</span>
        <strong style="color: #ffd54f;">
          ${escapeHtml(
            order.transactionId || "N/A"
          )}
        </strong>
      </div>


      <div class="line">
        <span>🌎 Server:</span>
        <strong>
          ${escapeHtml(
            order.server || ""
          )}
        </strong>
      </div>


      <div class="line">
        <span>🕐 Kòmand:</span>
        <strong>
          ${escapeHtml(date)}
        </strong>
      </div>


      ${buttons}

    `;


    box.appendChild(div);
  }
}


/* =====================================
   UPDATE ORDER
===================================== */

async function updateOrder(
  id,
  status
) {

  if (!ADMIN_TOKEN) {

    alert(
      "❌ Admin pa konekte."
    );

    return;
  }


  try {

    const response =
      await fetch(
        `${API}/update-order`,
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-admin-token":
              ADMIN_TOKEN
          },

          body:
            JSON.stringify({
              id,
              status
            })
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.message ||
        "HTTP " +
        response.status
      );
    }


    if (
      !result.success
    ) {

      throw new Error(
        "Backend lan pa konfime chanjman an."
      );
    }


    if (
      status === "processing"
    ) {

      showMessage(
        "✅ Kòmand la valide! (N ap konekte ak API an)",
        "#5ee39a"
      );

    }


    if (
      status === "failed"
    ) {

      showMessage(
        "❌ Nou pa resevwa peman an.",
        "#ff7777"
      );
    }


    await loadOrders();


  } catch (error) {

    console.error(
      "UPDATE ORDER ERROR:",
      error
    );


    showMessage(
      "❌ " +
      error.message,
      "#ff4d4d"
    );
  }
}


/* =====================================
   EFASE TOUT KÒMAND YON SÈL KOU (SIKSÈ / ÈCHÈK)
===================================== */

async function clearAllOrdersByStatus(statusType) {

  const targetOrders = allOrdersList.filter(o => o.status === statusType);

  if (!targetOrders.length) {
    alert(`⚠️ Pa gen okenn kòmand nan kategori ${statusType === 'success' ? 'SIKSÈ' : 'ÉCHEC'} pou efase.`);
    return;
  }

  const ok = confirm(`⚠️ Èske ou sèten ou vle efase TOUT (${targetOrders.length}) kòmand ${statusType === 'success' ? 'SIKSÈ' : 'ÉCHEC'} yo yon sèl kou?`);

  if (!ok) return;

  let count = 0;

  for (const order of targetOrders) {
    try {
      await fetch(`${API}/delete-order`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-admin-token": ADMIN_TOKEN
        },
        body: JSON.stringify({ id: order.id })
      });
      count++;
    } catch (err) {
      console.error("Erè pandan efasman an", order.id, err);
    }
  }

  showMessage(`🗑️ ${count} kòmand ${statusType === 'success' ? 'Siksè' : 'Échec'} efase nèt!`, "#5ee39a");
  await loadOrders();
}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =====================================
   ESCAPE JS
===================================== */

function escapeJs(
  value
) {

  return String(value)

    .replaceAll(
      "\\",
      "\\\\"
    )

    .replaceAll(
      "'",
      "\\'"
    )

    .replaceAll(
      "\n",
      "\\n"
    )

    .replaceAll(
      "\r",
      "\\r"
    );
}

</script>

</body>

</html>
