<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Alpha Admin</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0b0b12;
      color: white;
      padding: 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #00e5ff;
      margin-bottom: 20px;
    }

    .card {
      background: #151520;
      border: 1px solid #303044;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 9px;
      border: 1px solid #36364a;
      background: #0e0e17;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #00e5ff;
      color: #001014;
    }

    .on {
      background: #00c853;
      color: white;
    }

    .off {
      background: #d32f2f;
      color: white;
    }

    .process {
      background: #00c853;
      color: white;
    }

    .failed {
      background: #d32f2f;
      color: white;
    }

    .refresh {
      background: #36364a;
      color: white;
    }

    .message-choice {
      background: #0e0e17;
      border: 1px solid #36364a;
      color: white;
      text-align: left;
    }

    .status {
      padding: 10px;
      border-radius: 9px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .status-on {
      background: #123d25;
      color: #5ee39a;
    }

    .status-off {
      background: #4a1717;
      color: #ff7777;
    }

    .order {
      background: #0e0e17;
      border: 1px solid #303044;
      border-radius: 12px;
      padding: 13px;
      margin-top: 10px;
    }

    .line {
      margin: 7px 0;
      font-size: 14px;
    }

    .line span {
      color: #aaa;
    }

    .pack {
      color: #00e5ff;
    }

    .price {
      color: #00e5ff;
      font-weight: bold;
    }

    .order-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .order-buttons button {
      flex: 1;
    }

    #adminArea {
      display: none;
    }

    #offArea {
      display: none;
      margin-top: 10px;
    }

    #message {
      display: none;
      background: #151520;
      border-radius: 9px;
      padding: 12px;
      text-align: center;
      margin-bottom: 15px;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💎 TRUE ALPHA ADMIN</h1>

  <!-- LOGIN -->

  <div class="card" id="loginBox">

    <h3>🔐 Admin Login</h3>

    <input
      type="password"
      id="adminToken"
      placeholder="Antre ADMIN_TOKEN ou"
      autocomplete="off"
    >

    <button
      class="login"
      onclick="loginAdmin()"
    >
      🔓 ANTRE NAN ADMIN
    </button>

  </div>


  <!-- ADMIN AREA -->

  <div id="adminArea">

    <div id="message"></div>


    <!-- SITE CONTROL -->

    <div class="card">

      <h3>🌐 Kontwòl Sit la</h3>

      <div
        id="siteStatus"
        class="status status-on"
      >
        🟢 SIT LA ON
      </div>

      <button
        class="on"
        onclick="siteOn()"
      >
        🟢 SIT ON
      </button>

      <button
        class="off"
        onclick="showOffArea()"
      >
        🔴 SIT OFF
      </button>


      <div id="offArea">

        <p>
          Chwazi youn oswa ekri pwòp mesaj ou:
        </p>

        <button
          class="message-choice"
          onclick="setOffMessage('⏳ Sit la ap disponib talè.')"
        >
          ⏳ Sit la ap disponib talè.
        </button>

        <button
          class="message-choice"
          onclick="setOffMessage('🔧 Gen kèk bagay k ap ranje sou sit la. Li ap disponib talè.')"
        >
          🔧 Gen kèk bagay k ap ranje sou sit la. Li ap disponib talè.
        </button>

        <textarea
          id="customMessage"
          placeholder="✍️ Ekri pwòp mesaj OFF ou..."
        ></textarea>

        <button
          class="off"
          onclick="setCustomOffMessage()"
        >
          🔴 METE SIT LA OFF AK MESAJ SA
        </button>

      </div>

    </div>


    <!-- ORDERS -->

    <div class="card">

      <h3>📋 KÒMAND YO</h3>

      <button
        class="refresh"
        onclick="loadOrders()"
      >
        🔄 RAFRECHI KÒMAND YO
      </button>

      <div id="orders">
        <div class="empty">
          Peze RAFRECHI pou chaje kòmand yo.
        </div>
      </div>

    </div>

  </div>

</div>


<script>

const API = "/.netlify/functions";

let ADMIN_TOKEN = "";


/* =========================
   MESSAGE
========================= */

function showMessage(text, color = "#00e5ff") {

  const box =
    document.getElementById("message");

  box.style.display = "block";
  box.style.color = color;
  box.textContent = text;

}


/* =========================
   LOGIN
========================= */

async function loginAdmin() {

  const token =
    document.getElementById("adminToken").value.trim();

  if (!token) {

    alert("Tanpri antre ADMIN_TOKEN ou.");

    return;
  }

  ADMIN_TOKEN = token;

  try {

    const response =
      await fetch(`${API}/get-order`, {
        method: "GET",
        headers: {
          "x-admin-token": ADMIN_TOKEN
        }
      });

    if (response.status === 401) {

      ADMIN_TOKEN = "";

      alert("❌ ADMIN_TOKEN la pa bon.");

      return;
    }

    if (!response.ok) {

      alert("❌ Backend la pa reponn.");

      return;
    }

    document.getElementById(
      "loginBox"
    ).style.display = "none";

    document.getElementById(
      "adminArea"
    ).style.display = "block";

    showMessage(
      "✅ Admin konekte avèk siksè.",
      "#5ee39a"
    );

    await loadSiteStatus();
    await loadOrders();

  } catch (error) {

    console.error(error);

    alert(
      "❌ Pa kapab konekte ak backend la."
    );

  }

}


/* =========================
   SITE STATUS
========================= */

async function loadSiteStatus() {

  try {

    const response =
      await fetch(`${API}/site-status`, {
        method: "GET",
        cache: "no-store"
      });

    const data =
      await response.json();

    updateSiteDisplay(data.enabled !== false);

  } catch (error) {

    console.error(error);

  }

}


function updateSiteDisplay(isOpen) {

  const status =
    document.getElementById("siteStatus");

  if (isOpen) {

    status.className =
      "status status-on";

    status.textContent =
      "🟢 SIT LA ON";

  } else {

    status.className =
      "status status-off";

    status.textContent =
      "🔴 SIT LA OFF";

  }

}


/* =========================
   SHOW OFF AREA
========================= */

function showOffArea() {

  const area =
    document.getElementById("offArea");

  area.style.display =
    "block";

}


/* =========================
   SET OFF MESSAGE
========================= */

async function setOffMessage(message) {

  await saveSiteStatus(
    false,
    message
  );

}


/* =========================
   CUSTOM OFF MESSAGE
========================= */

async function setCustomOffMessage() {

  const message =
    document.getElementById(
      "customMessage"
    ).value.trim();

  if (!message) {

    alert(
      "Tanpri ekri yon mesaj."
    );

    return;
  }

  await saveSiteStatus(
    false,
    message
  );

}


/* =========================
   SAVE SITE STATUS
========================= */

async function saveSiteStatus(
  enabled,
  message
) {

  if (!ADMIN_TOKEN) {

    alert(
      "Admin pa konekte."
    );

    return;
  }

  try {

    const response =
      await fetch(`${API}/site-status`, {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json",
          "x-admin-token":
            ADMIN_TOKEN
        },
        body: JSON.stringify({
          enabled: enabled,
          message: message || ""
        })
      });

    const result =
      await response.json();

    if (!response.ok || !result.success) {

      throw new Error(
        result.message ||
        "Erè site status."
      );

    }

    updateSiteDisplay(enabled);

    document.getElementById(
      "offArea"
    ).style.display = "none";

    document.getElementById(
      "customMessage"
    ).value = "";

    showMessage(
      enabled
        ? "🟢 Sit la ON."
        : "🔴 Sit la OFF. Mesaj la aktive.",
      enabled
        ? "#5ee39a"
        : "#ff7777"
    );

  } catch (error) {

    console.error(error);

    showMessage(
      "❌ Pa kapab chanje status sit la.",
      "#ff4d4d"
    );

  }

}


/* =========================
   SIT ON
========================= */

async function siteOn() {

  await saveSiteStatus(
    true,
    ""
  );

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

  const ordersBox =
    document.getElementById("orders");

  ordersBox.innerHTML =
    '<div class="empty">⏳ Kòmand yo ap chaje...</div>';

  try {

    const response =
      await fetch(`${API}/get-order`, {
        method: "GET",
        headers: {
          "x-admin-token":
            ADMIN_TOKEN
        },
        cache: "no-store"
      });

    if (response.status === 401) {

      ordersBox.innerHTML =
        '<div class="empty">❌ Token admin lan pa otorize.</div>';

      return;
    }

    const result =
      await response.json();

    if (!response.ok || !result.success) {

      throw new Error(
        result.message ||
        "Erè lè chaje kòmand yo."
      );

    }

    renderOrders(
      result.orders || []
    );

  } catch (error) {

    console.error(error);

    ordersBox.innerHTML =
      '<div class="empty">❌ Kòmand yo pa ka chaje.</div>';

  }

}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(orders) {

  const ordersBox =
    document.getElementById("orders");

  if (!orders.length) {

    ordersBox.innerHTML =
      '<div class="empty">📭 Pa gen kòmand pou kounye a.</div>';

    return;
  }

  ordersBox.innerHTML = "";

  orders.forEach(order => {

    const div =
      document.createElement("div");

    div.className =
      "order";

    const date =
      order.createdAt
        ? new Date(
            order.createdAt
          ).toLocaleString()
        : "N/A";

    let statusText =
      "🟡 AN ATANT";

    if (order.status === "processing") {
      statusText =
        "⏳ AP TRAITE";
    }

    if (order.status === "failed") {
      statusText =
        "❌ ÉCHEC";
    }

    if (order.status === "success") {
      statusText =
        "✅ SIKSÈ";
    }

    div.innerHTML = `

      <div class="status">
        ${statusText}
      </div>

      <div class="line">
        <span>🆔 ID:</span>
        <strong>${escapeHtml(order.id || "")}</strong>
      </div>

      <div class="line">
        <span>🎮 UID:</span>
        <strong>${escapeHtml(order.uid || "")}</strong>
      </div>

      <div class="line">
        <span>💎 Pack:</span>
        <strong class="pack">
          ${escapeHtml(order.pack || "")}
        </strong>
      </div>

      <div class="line">
        <span>💰 Pri:</span>
        <strong class="price">
          ${escapeHtml(String(order.price || ""))} GDS
        </strong>
      </div>

      <div class="line">
        <span>📱 Nimewo:</span>
        <strong>
          ${escapeHtml(order.senderNumber || "")}
        </strong>
      </div>

      <div class="line">
        <span>🌎 Server:</span>
        <strong>
          ${escapeHtml(order.server || "")}
        </strong>
      </div>

      <div class="line">
        <span>🕐 Kòmand:</span>
        <strong>
          ${escapeHtml(date)}
        </strong>
      </div>

      ${
        order.status === "pending"
        ? `
          <div class="order-buttons">

            <button
              class="process"
              onclick="updateOrder(
                '${escapeHtml(order.id)}',
                'processing'
              )"
            >
              ✅ VALIDÉ
            </button>

            <button
              class="failed"
              onclick="updateOrder(
                '${escapeHtml(order.id)}',
                'failed'
              )"
            >
              ❌ ÉCHEC
            </button>

          </div>
        `
        : ""
      }

    `;

    ordersBox.appendChild(div);

  });

}


/* =========================
   UPDATE ORDER
========================= */

async function updateOrder(
  id,
  status
) {

  if (!ADMIN_TOKEN) {

    alert(
      "Admin pa konekte."
    );

    return;
  }

  try {

    const response =
      await fetch(`${API}/update-order`, {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json",
          "x-admin-token":
            ADMIN_TOKEN
        },
        body: JSON.stringify({
          id: id,
          status: status
        })
      });

    const result =
      await response.json();

    if (!response.ok || !result.success) {

      throw new Error(
        result.message ||
        "Erè kòmand."
      );

    }

    showMessage(
      status === "processing"
        ? "⏳ Kòmand lan ap trete."
        : "❌ Kòmand lan make kòm échec.",
      status === "processing"
        ? "#00e5ff"
        : "#ff7777"
    );

    await loadOrders();

  } catch (error) {

    console.error(error);

    showMessage(
      "❌ Pa kapab modifye kòmand lan.",
      "#ff4d4d"
    );

  }

}


/* =========================
   SECURITY DISPLAY
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
          </html>
