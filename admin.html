<!DOCTYPE html>
<html lang="ht">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True Alpha Admin</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #0b0b12;
  color: white;
  padding: 15px;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #00e5ff;
  margin-bottom: 20px;
}

.card {
  background: #151520;
  border: 1px solid #303044;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 15px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 9px;
  border: 1px solid #36364a;
  background: #0e0e17;
  color: white;
  outline: none;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.login { background: #00e5ff; color: #001014; }
.on { background: #00c853; color: white; }
.off { background: #d32f2f; color: white; }
.process { background: #00c853; color: white; }
.failed { background: #d32f2f; color: white; }
.refresh { background: #36364a; color: white; }

.delete-btn-all {
  background: #9b2226;
  color: white;
  padding: 5px 8px;
  font-size: 10px;
  border-radius: 5px;
  margin-top: 5px;
}

.message-choice {
  background: #0e0e17;
  border: 1px solid #36364a;
  color: white;
  text-align: left;
}

.status {
  padding: 10px;
  border-radius: 9px;
  text-align: center;
  font-weight: bold;
  margin-bottom: 10px;
}

.status-on {
  background: #123d25;
  color: #5ee39a;
}

.status-off {
  background: #4a1717;
  color: #ff7777;
}

.order {
  background: #0e0e17;
  border: 1px solid #303044;
  border-radius: 12px;
  padding: 13px;
  margin-top: 10px;
}

.line {
  margin: 7px 0;
  font-size: 14px;
}

.line span {
  color: #aaa;
}

.pack {
  color: #00e5ff;
}

.price {
  color: #00e5ff;
  font-weight: bold;
}

.order-buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.order-buttons button {
  flex: 1;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 15px;
}

.stat {
  background: #0e0e17;
  border: 1px solid #303044;
  border-radius: 10px;
  padding: 12px 5px;
  text-align: center;
}

.stat-number {
  display: block;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 4px;
}

.stat-label {
  font-size: 11px;
  font-weight: bold;
}

.pending-number {
  color: #ffd54f;
}

.success-number {
  color: #5ee39a;
}

.failed-number {
  color: #ff7777;
}

.section-title {
  margin-top: 20px;
  margin-bottom: 8px;
  padding: 10px;
  border-radius: 9px;
  background: #10101b;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.pending-title {
  color: #ffd54f;
}

.pagination-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  margin-bottom: 10px;
}

.nav-btn {
  background: #00e5ff;
  color: #001014;
  width: auto;
  padding: 8px 16px;
  margin-top: 0;
  font-size: 16px;
}

.nav-btn:disabled {
  background: #252538;
  color: #666;
  cursor: not-allowed;
}

.page-indicator {
  font-size: 14px;
  color: #aaa;
  font-weight: bold;
}

.list {
  margin-bottom: 15px;
}

#adminArea,
#offArea,
#message {
  display: none;
}

#message {
  background: #151520;
  border-radius: 9px;
  padding: 12px;
  text-align: center;
  margin-bottom: 15px;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 20px;
}

.tx-highlight {
  background: #2b2409;
  border: 1px solid #ffd54f;
  padding: 8px 10px;
  border-radius: 8px;
  margin: 8px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>💎 TRUE ALPHA ADMIN</h1>

<div class="card" id="loginBox">

<h3>🔐 Admin Login</h3>

<input
type="password"
id="adminToken"
placeholder="Antre ADMIN_TOKEN ou"
autocomplete="off"
>

<button
class="login"
onclick="loginAdmin()"
>
🔓 ANTRE NAN ADMIN
</button>

</div>


<div id="adminArea">

<div id="message"></div>


<div class="card">

<h3>🌐 Kontwòl Sit la</h3>

<div
id="siteStatus"
class="status status-on"
>
🟢 SIT LA ON
</div>

<button
class="on"
onclick="siteOn()"
>
🟢 SIT ON
</button>

<button
class="off"
onclick="showOffArea()"
>
🔴 SIT OFF
</button>


<div id="offArea">

<p>
Chwazi youn oswa ekri pwòp mesaj ou:
</p>

<button
class="message-choice"
onclick="setOffMessage('⏳ Sit la ap disponib talè.')"
>
⏳ Sit la ap disponib talè.
</button>

<button
class="message-choice"
onclick="setOffMessage('🔧 Gen kèk bagay k ap ranje sou sit la. Li ap disponib talè.')"
>
🔧 Gen kèk bagay k ap ranje sou sit la. Li ap disponib talè.
</button>

<textarea
id="customMessage"
placeholder="✍️ Ekri pwòp mesaj OFF ou..."
></textarea>

<button
class="off"
onclick="setCustomOffMessage()"
>
🔴 METE SIT LA OFF AK MESAJ SA
</button>

</div>

</div>


<div class="card">

<h3>📋 KÒMAND YO</h3>


<div class="stats">

<div class="stat">

<span
id="pendingCount"
class="stat-number pending-number"
>
0
</span>

<span class="stat-label">
🟡 AN ATANT
</span>

</div>


<div class="stat">

<span
id="successCount"
class="stat-number success-number"
>
0
</span>

<span class="stat-label">
✅ SIKSÈ
</span>

<button
class="delete-btn-all"
onclick="clearAllOrdersByStatus('success')"
>
🗑️ Efase tout
</button>

</div>


<div class="stat">

<span
id="failedCount"
class="stat-number failed-number"
>
0
</span>

<span class="stat-label">
❌ ÉCHEC
</span>

<button
class="delete-btn-all"
onclick="clearAllOrdersByStatus('failed')"
>
🗑️ Efase tout
</button>

</div>

</div>


<button
class="refresh"
onclick="loadOrders()"
>
🔄 RAFRECHI KÒMAND YO
</button>


<div class="section-title pending-title">

<span>
🟡 KÒMAND AN ATANT
</span>

</div>


<div
class="pagination-controls"
id="paginationBox"
style="display:none;"
>

<button
class="nav-btn"
id="prevBtn"
onclick="changePage(-1)"
>
◄ Prasa
</button>

<span
class="page-indicator"
id="pageIndicator"
>
0 / 0
</span>

<button
class="nav-btn"
id="nextBtn"
onclick="changePage(1)"
>
Pwochen ►
</button>

</div>


<div
id="pendingList"
class="list"
>

<div class="empty">
Pa gen kòmand an atant.
</div>

</div>

</div>

</div>

</div>


<script>

const API = "/api";

let ADMIN_TOKEN = "";

let allOrdersList = [];

let currentIndex = 0;


/* MESSAGE */

function showMessage(
text,
color = "#00e5ff"
) {

const box =
document.getElementById("message");

box.style.display = "block";

box.style.color = color;

box.textContent = text;

}


/* LOGIN */

async function loginAdmin() {

const token =
document
.getElementById("adminToken")
.value
.trim();

if (!token) {

alert(
"⚠️ Tanpri antre ADMIN_TOKEN ou."
);

return;

}

ADMIN_TOKEN = token;

try {

const response =
await fetch(
`${API}/get-orders?t=${Date.now()}`,
{
method: "GET",

headers: {
"x-admin-token":
ADMIN_TOKEN,

"Accept":
"application/json",

"Cache-Control":
"no-cache"
},

cache: "no-store"

}
);


const result =
await response.json();


if (response.status === 401) {

ADMIN_TOKEN = "";

alert(
"❌ ADMIN_TOKEN la pa bon."
);

return;

}


if (
!response.ok ||
result.success !== true
) {

throw new Error(
result.message ||
"HTTP " +
response.status
);

}


document
.getElementById("loginBox")
.style.display = "none";


document
.getElementById("adminArea")
.style.display = "block";


showMessage(
"✅ Admin konekte avèk siksè.",
"#5ee39a"
);


await loadSiteStatus();


allOrdersList =
result.orders || [];


renderAllLists();


} catch (error) {

console.error(
"LOGIN ERROR:",
error
);

alert(
"❌ " +
error.message
);

}

}


/* SITE STATUS */

async function loadSiteStatus() {

try {

const response =
await fetch(
`${API}/site-status?t=${Date.now()}`,
{
method: "GET",
cache: "no-store"
}
);


const data =
await response.json();


updateSiteDisplay(
data.enabled !== false
);


} catch (error) {

console.error(
"SITE STATUS ERROR:",
error
);

}

}


function updateSiteDisplay(
isOpen
) {

const status =
document.getElementById(
"siteStatus"
);


if (isOpen) {

status.className =
"status status-on";

status.textContent =
"🟢 SIT LA ON";

} else {

status.className =
"status status-off";

status.textContent =
"🔴 SIT LA OFF";

}

}


function showOffArea() {

document
.getElementById("offArea")
.style.display = "block";

}


async function setOffMessage(
message
) {

await saveSiteStatus(
false,
message
);

}


async function setCustomOffMessage() {

const message =
document
.getElementById(
"customMessage"
)
.value
.trim();


if (!message) {

alert(
"⚠️ Tanpri ekri yon mesaj."
);

return;

}


await saveSiteStatus(
false,
message
);

}


async function saveSiteStatus(
enabled,
message
) {

if (!ADMIN_TOKEN) return;


try {

const response =
await fetch(
`${API}/site-status`,
{
method: "POST",

headers: {
"Content-Type":
"application/json",

"x-admin-token":
ADMIN_TOKEN
},

body: JSON.stringify({
enabled,
message:
message || ""
})

}
);


const result =
await response.json();


if (
!response.ok ||
!result.success
) {

throw new Error(
result.message ||
"Erè backend."
);

}


updateSiteDisplay(
enabled
);


document
.getElementById("offArea")
.style.display = "none";


document
.getElementById("customMessage")
.value = "";


showMessage(
enabled
? "🟢 Sit la ON."
: "🔴 Sit la OFF. Mesaj la aktive.",

enabled
? "#5ee39a"
: "#ff7777"
);


} catch (error) {

showMessage(
"❌ " +
error.message,

"#ff4d4d"
);

}

}


async function siteOn() {

await saveSiteStatus(
true,
""
);

}


/* LOAD ORDERS */

async function loadOrders() {

if (!ADMIN_TOKEN) return;

try {

const response =
await fetch(
`${API}/get-orders?t=${Date.now()}`,
{
method: "GET",

headers: {
"x-admin-token":
ADMIN_TOKEN,

"Accept":
"application/json",

"Cache-Control":
"no-cache"
},

cache: "no-store"
}
);


const result =
await response.json();


if (
!response.ok ||
!result.success
) {

throw new Error(
result.message ||
"Erè backend."
);

}


/*
 * REFRESH LA PA RANPLASE
 * LALIS ADMIN LAN NÈT.
 *
 * Li pran nouvo kòmand sèlman.
 */

const freshOrders =
result.orders || [];


/*
 * Ajoute sèlman ID ki pa t
 * deja nan lis la.
 */

for (
const newOrder of freshOrders
) {

const exists =
allOrdersList.some(
oldOrder =>
oldOrder.id ===
newOrder.id
);


if (!exists) {

allOrdersList.push(
newOrder
);

}

}


/*
 * Mete status aktyèl yo ajou
 * san nou pa fè success/failed
 * retounen kòm nouvo kòmand.
 */

for (
const serverOrder of freshOrders
) {

const localOrder =
allOrdersList.find(
order =>
order.id ===
serverOrder.id
);


if (localOrder) {

localOrder.status =
serverOrder.status;

localOrder.customerMessage =
serverOrder.customerMessage;

}

}


/*
 * Pa ajoute ansyen success/failed
 * yo kòm nouvo kòmand.
 *
 * Si yon pending te vin success
 * oswa failed, li rete nan done
 * lokal yo men li pap parèt nan
 * lis AN ATANT.
 */

allOrdersList.sort(
(a, b) =>
new Date(
b.createdAt || 0
) -
new Date(
a.createdAt || 0
)
);


/*
 * Si refresh la vini ak yon
 * pending ki pa nan lis la,
 * li parèt.
 */

renderAllLists();


showMessage(
"🔄 Refresh fini — nouvo kòmand yo chaje.",
"#00e5ff"
);


} catch (error) {

console.error(
"REFRESH ORDERS ERROR:",
error
);

showMessage(
"❌ " +
error.message,
"#ff4d4d"
);

}

}


/* RENDER ALL LISTS */

function renderAllLists() {

const pending =
allOrdersList.filter(
o => o.status === "pending"
);


const failed =
allOrdersList.filter(
o => o.status === "failed"
);


const success =
allOrdersList.filter(
o =>
o.status === "success" ||
o.status === "processing"
);


document
.getElementById(
"pendingCount"
)
.textContent =
pending.length;


document
.getElementById(
"failedCount"
)
.textContent =
failed.length;


document
.getElementById(
"successCount"
)
.textContent =
success.length;


const paginationBox =
document.getElementById(
"paginationBox"
);


if (pending.length === 0) {

paginationBox.style.display =
"none";

document
.getElementById(
"pendingList"
)
.innerHTML =
'<div class="empty">📭 Pa gen kòmand an atant pou kounye a.</div>';

return;

}


paginationBox.style.display =
"flex";


if (
currentIndex >=
pending.length
) {

currentIndex =
pending.length - 1;

}


if (currentIndex < 0) {

currentIndex = 0;

}


document
.getElementById(
"pageIndicator"
)
.textContent =
`${currentIndex + 1} / ${pending.length}`;


document
.getElementById("prevBtn")
.disabled =
currentIndex === 0;


document
.getElementById("nextBtn")
.disabled =
currentIndex ===
pending.length - 1;


renderList(
[pending[currentIndex]],
"pendingList"
);

}


function changePage(
direction
) {

currentIndex +=
direction;

renderAllLists();

}


/* RENDER ORDER */

function renderList(
orders,
containerId
) {

const box =
document.getElementById(
containerId
);


box.innerHTML = "";


for (
const order of orders
) {

const div =
document.createElement(
"div"
);


div.className =
"order";


const date =
order.createdAt
? new Date(
order.createdAt
).toLocaleString()
: "N/A";


const userTxCode =
order.transactionId ||
order.transaction_id ||
order.transId ||
order.code ||
"Pa gen kòd";


div.innerHTML = `

<div class="status">
🟡 AN ATANT
</div>

<div class="line">
<span>🆔 ID:</span>
<strong>
${escapeHtml(
order.id || ""
)}
</strong>
</div>

<div class="line">
<span>🎮 UID:</span>
<strong>
${escapeHtml(
order.uid || ""
)}
</strong>
</div>

<div class="line">
<span>💎 Pack:</span>
<strong class="pack">
${escapeHtml(
order.pack || ""
)}
</strong>
</div>

<div class="line">
<span>💰 Pri:</span>
<strong class="price">
${escapeHtml(
String(
order.price || ""
)
)}
GDS
</strong>
</div>

<div class="line">
<span>📱 Nimewo/Non:</span>
<strong>
${escapeHtml(
order.senderNumber || ""
)}
</strong>
</div>

<div class="tx-highlight">

<div
style="
color:#aaa;
font-size:12px;
"
>
🧾 KÒD TRANZAKSYON
(NATCASH/MONCASH):
</div>

<strong
style="
color:#ffd54f;
font-size:16px;
"
>
${escapeHtml(
userTxCode
)}
</strong>

</div>

<div class="line">
<span>🌎 Server:</span>
<strong>
${escapeHtml(
order.server || ""
)}
</strong>
</div>

<div class="line">
<span>🕐 Kòmand:</span>
<strong>
${escapeHtml(
date
)}
</strong>
</div>


<div class="order-buttons">

<button
class="process"
onclick="
updateOrder(
'${escapeJs(
order.id || ""
)}',
'processing'
)
"
>
✅ VALIDÉ
</button>


<button
class="failed"
onclick="
handleFailOrder(
'${escapeJs(
order.id || ""
)}'
)
"
>
❌ ÉCHEC
</button>

</div>

`;


box.appendChild(div);

}

}


/* ECHEC */

function handleFailOrder(
id
) {

const reason =
prompt(
"🔴 Antre mesaj echèk la pou kliyan an:",
"Nou pa resevwa peman an."
);


if (reason === null) {
return;
}


updateOrder(
id,
"failed",
reason.trim() ||
"Nou pa resevwa peman an."
);

}


/* UPDATE ORDER */

async function updateOrder(
id,
status,
customerMessage = ""
) {

if (!ADMIN_TOKEN) {

alert(
"❌ Admin pa konekte."
);

return;

}


const target =
allOrdersList.find(
o => o.id === id
);


if (target) {

target.status =
status;

target.customerMessage =
customerMessage;

}


if (status === "failed") {

showMessage(
"❌ Kòmand lan voye nan ÈCHÈK avèk siksè!",
"#ff7777"
);

} else {

showMessage(
"✅ Kòmand lan VALIDÉ avèk siksè!",
"#5ee39a"
);

}


renderAllLists();


try {

const response =
await fetch(
`${API}/update-order`,
{
method: "POST",

headers: {
"Content-Type":
"application/json",

"x-admin-token":
ADMIN_TOKEN
},

body: JSON.stringify({
id,
status,
customerMessage
})

}
);


const result =
await response.json();


if (
!response.ok ||
!result.success
) {

throw new Error(
result.message ||
"Erè backend."
);

}


} catch (error) {

console.error(
"UPDATE ERROR:",
error
);


showMessage(
"⚠️ Pasaj lokal la fèt men gen yon ti pwoblèm nan backend lan.",
"#ff4d4d"
);

}

}


/* CLEAR ALL */

async function clearAllOrdersByStatus(
statusType
) {

const targetOrders =
allOrdersList.filter(
o =>
statusType === "success"
? (
o.status === "success" ||
o.status === "processing"
)
: o.status === statusType
);


if (!targetOrders.length) {

alert(
`⚠️ Pa gen okenn kòmand nan kategori ${
statusType === "success"
? "SIKSÈ"
: "ÉCHEC"
} pou efase.`
);

return;

}


if (
!confirm(
`⚠️ Èske ou sèten ou vle efase TOUT (${targetOrders.length}) kòmand ${
statusType === "success"
? "SIKSÈ"
: "ÉCHEC"
} yo?`
)
) {
return;
}


allOrdersList =
allOrdersList.filter(
o =>
statusType === "success"
? (
o.status !== "success" &&
o.status !== "processing"
)
: o.status !== statusType
);


renderAllLists();


for (
const order of targetOrders
) {

try {

await fetch(
`${API}/delete-order`,
{
method: "POST",

headers: {
"Content-Type":
"application/json",

"x-admin-token":
ADMIN_TOKEN
},

body: JSON.stringify({
id: order.id
})

}
);

} catch (err) {

console.error(
"Erè efasman:",
order.id,
err
);

}

}


showMessage(
`🗑️ Kòmand ${
statusType === "success"
? "Siksè"
: "Échec"
} yo efase nèt!`,
"#5ee39a"
);

}


/* ESCAPE HTML */

function escapeHtml(
value
) {

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* ESCAPE JS */

function escapeJs(
value
) {

return String(value)

.replaceAll(
"\\",
"\\\\"
)

.replaceAll(
"'",
"\\'"
)

.replaceAll(
"\n",
"\\n"
)

.replaceAll(
"\r",
"\\r"
);

}

</script>

</body>
  </html>
